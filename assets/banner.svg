<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="50%" stop-color="#d2a8ff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #8b949e;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38d430;
    }
    .pulse-node {
      animation: pulse 3s infinite ease-in-out;
    }
    .float-orb {
      animation: float 6s infinite ease-in-out;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dash 20s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Dynamic Animated Background Orbs & Flows (Behind Content) -->
  <g class="float-orb">
    <circle cx="150" cy="80" r="90" fill="url(#accentGrad)" filter="url(#glow)" />
    <circle cx="1050" cy="240" r="110" fill="url(#accentGrad)" filter="url(#glow)" />
  </g>

  <!-- Decorative Network Grid / Dynamic Flows in Background -->
  <g stroke="#30363d" stroke-width="1.5" opacity="0.5">
    <line x1="80" y1="50" x2="1120" y2="50" class="flow-line" stroke="#1f6feb" stroke-width="1"/>
    <line x1="80" y1="270" x2="1120" y2="270" class="flow-line" stroke="#8957e5" stroke-width="1"/>
    <circle cx="200" cy="50" r="4" fill="#58a6ff" class="pulse-node"/>
    <circle cx="600" cy="50" r="4" fill="#bc8cff" class="pulse-node"/>
    <circle cx="1000" cy="50" r="4" fill="#39d353" class="pulse-node"/>
    <circle cx="400" cy="270" r="4" fill="#58a6ff" class="pulse-node"/>
    <circle cx="800" cy="270" r="4" fill="#bc8cff" class="pulse-node"/>
  </g>

  <!-- Text Foreground Backdrop Card (Ensures absolute readability) -->
  <rect x="60" y="60" width="1080" height="200" rx="12" fill="#161b22" opacity="0.85" stroke="#30363d" stroke-width="1"/>

  <!-- Foreground Content -->
  <g transform="translate(100, 120)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#1f6feb" opacity="0.2" stroke="#238636" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#39d353" class="pulse-node"/>
    <text x="26" y="19" class="badge-text">CRM ECOSYSTEM 🚀</text>

    <!-- Main Title -->
    <text x="0" y="70" class="title">Awesome All-In-One Starter CRM</text>

    <!-- Subtitle -->
    <text x="0" y="105" class="subtitle">The Definitive Guide to Commercial SaaS &amp; Open-Source CRM Frameworks</text>
  </g>
</svg>
